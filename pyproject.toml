[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ryadom-dating-bot"
version = "0.2.0"
description = "Мэтч — Telegram Mini App знакомств и уведомления"
requires-python = ">=3.12"
dependencies = ["aiogram==3.28.0", "aiosqlite==0.22.1", "aiohttp==3.13.5"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]
ui = ["playwright==1.58.0"]

[project.scripts]
ryadom = "dating.__main__:main"
metch = "dating.__main__:main"

[tool.setuptools.packages.find]
include = ["dating*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
dating = ["web/*", "web/images/*"]
